; PlatformIO Project Configuration File
;
; NightMare Network wall dashboard, ESP32-P4 edition.
; Target: Guition JC1060P470C -- ESP32-P4 (360 MHz), 16MB flash, 32MB PSRAM,
; 7" 1024x600 MIPI-DSI panel (JD9165), GT911 touch, ESP32-C6 Wi-Fi co-processor
; reached over ESP-Hosted. Native ESP-IDF, no Arduino.
;
; Everything specific to this board lives in board/, the Windows USB screen in usb_screen/.
; Notes for agents live in .local/ (git-ignored).
;
; Three firmwares, one source tree (custom_dash_app picks the sources, see CMakeLists.txt):
;   jc1060p470c                the dashboard
;   jc1060p470c_usbscreen      the panel as a Windows USB extended display only (stage 1)
;   jc1060p470c_usbscreen_nm   the dashboard + the Windows display when the PC streams (stage 2)
;   jc1060p470c_usbscreen_nm_espnow   stage 2 + ESP-NOW through the C6 (stage 3; C6 runs ../dash-p4-c6)
;
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
; Generic P4 (silicon older than v3.0, which is what this board's vendor build
; selects). If the boot log reports chip revision v3.x use esp32-p4_r3 and
; flip the revision in board/sdkconfig.board -- see .local/findings.md.
board = esp32-p4
framework = espidf
; The generic board json says 4MB; this board has 16MB. The partition table
; and CONFIG_ESPTOOLPY_FLASHSIZE_16MB (board/sdkconfig.board) are what matter,
; this keeps PlatformIO's size report honest.
board_upload.flash_size = 16MB
board_upload.maximum_size = 6291456
board_build.partitions = partitions.csv
monitor_speed = 115200
; NightMare's logger colours lines with ANSI codes; the default filter would
; print each ESC as a visible character.
monitor_filters = direct, send_on_enter, reset_on_start
monitor_echo = yes

extra_scripts =
	pre:src/Version/script.py

[env:jc1060p470c]
custom_dash_app = dashboard

build_flags =
	-I include
	-Wno-unused-variable
	; NightMareNetwork speaks std::string through ArduinoJson.
	-DARDUINOJSON_ENABLE_STD_STRING=1
	; Generated font files (src/UI/Assets) include "lvgl.h" directly.
	-DLV_LVGL_H_INCLUDE_SIMPLE

lib_deps =
	; The library's own main branch: native-IDF capable, MQTT + ESP-NOW routing.
	; Never edit the copy PlatformIO puts under .pio/libdeps -- change
	; nightmare/lib/nightmarenetwork and bump (see the umbrella AGENTS.md).
	https://github.com/vtmattedi/NightMareNetwork.git

; Stage 1: Windows USB extended display (+ touch) on the high-speed USB-C port, nothing else.
; The PC needs Espressif's USB Extended Display driver (see usb_screen/NOTES.md).
[env:jc1060p470c_usbscreen]
custom_dash_app = usb_screen
build_flags =
	-Wno-unused-variable

; Stage 2: the dashboard on the NightMare network, and the Windows display whenever the PC streams.
[env:jc1060p470c_usbscreen_nm]
extends = env:jc1060p470c
custom_dash_app = dashboard_usb

; Stage 3: stage 2 + ESP-NOW through the ESP32-C6. The C6 must run the sister project's firmware
; (nightmare/devices/dash-p4-c6); install it from Settings > Firmware > Update C6..., or the C6OTA console command.
; Without it ESP-NOW reports "not supported" and MQTT carries on alone.
[env:jc1060p470c_usbscreen_nm_espnow]
extends = env:jc1060p470c_usbscreen_nm
custom_dash_espnow = yes
build_flags =
	${env:jc1060p470c.build_flags}
	-DNM_NETWORK_ESPNOW=1
