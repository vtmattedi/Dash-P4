## Managed components the USB screen needs. Copy this file with the folder.
dependencies:
  idf: ">=5.5.0"
  # TinyUSB device stack (the plain stack, configured by tusb/tusb_config.h; not esp_tinyusb).
  espressif/tinyusb: "~0.21.0"
  # usb_screen.h takes an esp_lcd_touch handle.
  espressif/esp_lcd_touch:
    version: "^1.2.0"
    require: public
